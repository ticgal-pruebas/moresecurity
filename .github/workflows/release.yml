name: Release

# Creates a GitHub release (tag + notes + package) when a pull request from
# `develop` is merged into `main`, then uploads the package to a GLPI instance.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    # Only merged PRs, from develop, coming from this very repository (never a fork)
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      package: ${{ steps.package.outputs.file }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          # The plugin folder name must match the plugin key: tools/make_release.sh
          # derives the package name from it.
          path: ${{ github.event.repository.name }}

      - name: Read plugin metadata
        id: meta
        env:
          PLUGIN: ${{ github.event.repository.name }}
        working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          const_name="PLUGIN_$(echo "$PLUGIN" | tr '[:lower:]' '[:upper:]')_VERSION"
          version=$(grep -oP "define\('${const_name}',\s*'\K[^']+" setup.php | head -n1 || true)
          if [ -z "$version" ]; then
            echo "::error::Could not read ${const_name} from setup.php"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Version '$version' is not valid (use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease; build metadata with '+' is not accepted in tags)"
            exit 1
          fi
          # Display name: the literal 'name' of plugin_version_<key>() in setup.php
          # (any number of words, e.g. "More Security", "Talent"). Names built with
          # a function call (e.g. _n(...)) are not literals: fall back to the repo name.
          name=$(awk -v fn="plugin_version_${PLUGIN}" '
            index(tolower($0), tolower("function " fn "(")) { f = 1 }
            f && /['"'"'"]name['"'"'"][[:space:]]*=>/ { print; exit }
          ' setup.php | sed -nE "s/^[[:space:]]*['\"]name['\"][[:space:]]*=>[[:space:]]*(['\"])(.*)\1[[:space:]]*,[[:space:]]*\$/\2/p")
          case "$name" in *\\*|*'$'*|'') name="" ;; esac
          if [ -z "$name" ]; then
            name="$(echo "${PLUGIN:0:1}" | tr '[:lower:]' '[:upper:]')${PLUGIN:1}"
            echo "::warning::No literal plugin name in setup.php; using '$name'."
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=$version"
            echo "name=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Plugin $name ($PLUGIN) version $version (prerelease: $prerelease)"

      - name: Fail if the tag already exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Bump the plugin version in setup.php before merging into main."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Entry of this version: "## [VERSION]" up to the next "## [" heading,
          # without leading/trailing blank lines. Used as is by the release
          # description and by the GLPI document comment.
          tr -d '\r' < CHANGELOG.md | awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then
            echo "::warning::No CHANGELOG.md section found for ${VERSION}; using the PR title."
            printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/changelog.md"
          fi
          { cat "$RUNNER_TEMP/changelog.md"; printf '\nMerged through #%s.\n' "$PR_NUMBER"; } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Build package
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PLUGIN: ${{ github.event.repository.name }}
        working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Reuse the project's own packaging script so CI and manual releases match.
          bash tools/make_release.sh "$VERSION" < /dev/null
          file="/tmp/glpi-${PLUGIN}-${VERSION}.tar.bz2"
          test -s "$file"
          mkdir -p "$RUNNER_TEMP/dist"
          mv "$file" "$RUNNER_TEMP/dist/"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          echo "file=$(basename "$file")" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/dist" >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/dist"
          # make_release.sh does not fail when composer fails, so verify the content.
          listing="$RUNNER_TEMP/package-listing.txt"
          tar tjf "$RUNNER_TEMP/dist/$(basename "$file")" > "$listing"
          for required in "${PLUGIN}/setup.php" "${PLUGIN}/hook.php"; do
            grep -qx "$required" "$listing" || { echo "::error::Package is missing $required"; exit 1; }
          done
          if grep -q '^[^/]*/composer.json$' "$listing"; then
            grep -Eq "^${PLUGIN}/(public/)?vendor/autoload.php$" "$listing" \
              || { echo "::error::Package has no vendor/autoload.php (composer install failed?)"; exit 1; }
          fi
          if grep -Eq "^${PLUGIN}/(\.github|tools|docs|tests)(/|$)|/phpunit/|^${PLUGIN}/\.gitleaks\.toml$" "$listing"; then
            echo "::error::Package contains development files"
            grep -E "^${PLUGIN}/(\.github|tools|docs|tests)(/|$)" "$listing" | head
            exit 1
          fi
          wc -l "$listing"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "${NAME} ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" "$RUNNER_TEMP/dist/"*

      - name: Keep the package for the GLPI upload job
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/dist/*.tar.bz2
          if-no-files-found: error
          retention-days: 1

      - name: Keep the changelog entry for the GLPI upload job
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog.md
          if-no-files-found: error
          retention-days: 1

  upload-glpi:
    name: Upload package to GLPI
    needs: release
    # Runs on a self-hosted runner that can reach the GLPI instance.
    runs-on: [self-hosted, glpi-local]
    if: vars.GLPI_URL != ''
    permissions:
      contents: read
    steps:
      - name: Checkout upload script (merged code, only .github/scripts)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Download changelog entry
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: notes

      - name: Upload to GLPI
        env:
          GLPI_URL: ${{ vars.GLPI_URL }}
          GLPI_CLIENT_ID: ${{ secrets.GLPI_CLIENT_ID }}
          GLPI_CLIENT_SECRET: ${{ secrets.GLPI_CLIENT_SECRET }}
          GLPI_USERNAME: ${{ secrets.GLPI_USERNAME }}
          GLPI_PASSWORD: ${{ secrets.GLPI_PASSWORD }}
          GLPI_INSECURE_TLS: ${{ vars.GLPI_INSECURE_TLS }}
          # Plugin -> GLPI mapping: id of this plugin's Software in the GLPI that
          # receives the packages. The document takes its entity and recursion
          # from that Software. Set this value when adopting the workflow.
          GLPI_SOFTWARE_ID: "999"
          # Id of the document heading the package is filed under ("TICGAL Plugins").
          GLPI_DOCUMENT_CATEGORY_ID: "1"
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}
          PACKAGE: ${{ needs.release.outputs.package }}
          VERSION: ${{ needs.release.outputs.version }}
          NAME: ${{ needs.release.outputs.name }}
          NOTES_FILE: notes/changelog.md
        run: |
          set -euo pipefail
          bash .github/scripts/glpi-upload.sh "dist/${PACKAGE}" "${VERSION}"

      # Only reached when the upload worked (or the package was already in GLPI): the
      # runner keeps the last package that made it, replacing the previous one, so a
      # failed later release never leaves it without a known-good copy to recover from.
      # Where: repository variable GLPI_KEEP_DIR, by default ~/.cache/glpi-release-packages.
      - name: Keep the last uploaded package on the runner
        env:
          PACKAGE: ${{ needs.release.outputs.package }}
          KEEP_ROOT: ${{ vars.GLPI_KEEP_DIR }}
        run: |
          set -euo pipefail
          root="${KEEP_ROOT:-$HOME/.cache/glpi-release-packages}"
          dest="${root}/${GITHUB_REPOSITORY#*/}"
          : "${dest:?}"
          mkdir -p "$dest"
          cp "dist/${PACKAGE}" "${dest}/.incoming"
          find "$dest" -maxdepth 1 -type f ! -name .incoming -delete
          mv "${dest}/.incoming" "${dest}/${PACKAGE}"
          echo "Kept ${dest}/${PACKAGE}"

      # The runner is ours and its workspace outlives the job: leave nothing of the
      # package, the notes or the checkout behind, whatever the outcome.
      - name: Clean the runner workspace
        if: always()
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?}"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
